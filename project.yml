name: Pauseo

options:
  bundleIdPrefix: app.pauseo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

schemes:
  Pauseo:
    build:
      targets:
        Pauseo: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

targets:
  Pauseo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pauseo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pauseo
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "\"Pauseo/Preview Content\""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        DEVELOPMENT_TEAM: "5T4Z65558R"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
    info:
      path: Pauseo/Info.plist
      properties:
        CFBundleLocalizations: [en, pl]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
